name: dufs_sender
description: A lightweight Android file sender for dufs file server.
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.0.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.0
  file_picker: ^8.0.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.0
  uuid: ^4.2.0
  intl: ^0.20.2
  receive_sharing_intent: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
