name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Sync version from pubspec.yaml
        shell: bash
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1)
          FULL_VERSION=$(echo "$VERSION_LINE" | sed 's/version: *//')
          VERSION_NAME=$(echo "$FULL_VERSION" | sed 's/+.*//')
          BUILD_NUMBER=$(echo "$FULL_VERSION" | sed 's/.*+//')
          if [ "$BUILD_NUMBER" = "$VERSION_NAME" ]; then
            BUILD_NUMBER="1"
          fi
          cat > lib/utils/version.dart << EOF
          const appVersion = '${FULL_VERSION}';
          const appVersionName = '${VERSION_NAME}';
          const appBuildNumber = '${BUILD_NUMBER}';
          EOF
          echo "Version synced: $FULL_VERSION"

      - name: Create keystore and key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload_key.jks
            cat > android/key.properties << EOF
          storeFile=upload_key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Keystore created with alias: $KEY_ALIAS"
          else
            echo "No keystore secrets set — using debug signing"
          fi

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs with version
        shell: bash
        run: |
          VERSION_NAME=$(grep 'const appVersionName' lib/utils/version.dart | tr -d " '" | sed 's/constappVersionName=//' | sed 's/;//')
          APK_DIR="build/app/outputs/flutter-apk"
          for f in "$APK_DIR"/*.apk; do
            BASENAME=$(basename "$f" .apk)
            mv "$f" "$APK_DIR/dufs-sender-${VERSION_NAME}-${BASENAME}.apk"
          done
          ls -la "$APK_DIR"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
